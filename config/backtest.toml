# ── Data ────────────────────────────────────────────────────────────────────
[data]
data_dir        = "data"
symbol          = "ETH-USDT-SWAP.OKX"
price_precision = 2
size_precision  = 4
# OKX historical data files (relative to data_dir)
orderbook_file  = "ETH-USDT-SWAP-L2orderbook-5000lv-2026-05-16.data"
trades_file     = "ETH-USDT-SWAP-trades-2026-05-16.csv"

# ── Simulated venue ──────────────────────────────────────────────────────────
[venue]
name              = "OKX"
oms_type          = "Netting"
account_type      = "Cash"
book_type         = "L2_MBP"
starting_balance  = "100000 USDT"

# ── Logging ──────────────────────────────────────────────────────────────────
[logging]
log_dir     = "logs"
log_level   = "info"
log_to_file = true

# ── GLFT strategy parameters ─────────────────────────────────────────────────
[strategy]
gamma                        = 0.1
kappa                        = 1.5
sigma                        = 0.02
time_horizon_secs            = 3600
min_spread_bps               = 2.0
max_inventory                = 1.0
order_size                   = 0.01
quote_refresh_ms             = 1000
vol_window                   = 100
volatility_regime_multiplier = 3.0
