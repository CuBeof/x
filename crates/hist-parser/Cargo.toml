[package]
name = "hist-parser"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hist-parser"
path = "src/main.rs"

[dependencies]
nautilus-core          = "0.57.0"
nautilus-model         = "0.57.0"
nautilus-serialization = { version = "0.57.0", features = ["arrow"] }
parquet                = "58.3.0"
arrow                  = "58.3.0"
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"
csv                    = "1"
clap                   = { version = "4", features = ["derive"] }
anyhow                 = "1"
rust_decimal           = "1"
ustr                   = "1.1.0"
