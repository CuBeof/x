[package]
name = "market-maker"
version = "0.1.0"
edition = "2021"

[dependencies]
# nautilus_trader crates
nautilus-backtest  = "0.57.0"
nautilus-model     = "0.57.0"
nautilus-trading   = "0.57.0"
nautilus-common    = "0.57.0"
nautilus-core      = "0.57.0"

# Infrastructure
tokio          = { version = "1", features = ["full"] }
serde          = { version = "1", features = ["derive"] }
toml           = "0.8"
log            = "0.4"
clap           = { version = "4", features = ["derive"] }
chrono         = { version = "0.4", features = ["serde"] }
anyhow         = "1"
thiserror      = "1"
csv            = "1"
rust_decimal   = { version = "1", features = ["serde-with-str"] }
serde_json     = "1"
